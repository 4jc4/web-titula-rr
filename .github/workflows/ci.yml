name: CI

# lib/api/generated (orval) é COMMITADO — lint/typecheck/build/unit não
# dependem da api-titula-rr estar no ar. Duas coisas aqui olham para o
# repositório irmão: o job `contrato`, que compara o cliente gerado com o
# OpenAPI versionado da API, e o `e2e-tests`, que sobe a API de verdade.
on:
  push:
    branches: [main]
  pull_request:

# Push novo na mesma ref cancela o anterior: ninguém precisa do resultado de
# um commit que já foi substituído. O CD é o oposto (cancel-in-progress:
# false) — deploy pela metade é pior que deploy repetido.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo necessário: os jobs só fazem checkout. O default do repositório é
# mais largo, e token largo num workflow que executa actions de terceiros é
# permissão dada de graça.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Mesma imagem/credenciais do e2e da api-titula-rr (ver
        # docker-compose.dev.yml de lá) — precisa ser PostGIS, não um
        # Postgres comum, porque as migrações fazem CREATE EXTENSION postgis.
        #
        # 16-3.4 é a dupla de PRODUÇÃO. Este job aplica as migrações escritas
        # à mão da API (EXCLUDE com GiST, índices parciais, PL/pgSQL); rodar
        # numa major diferente devolve um verde que não significa o que
        # parece. Estava em 17-3.5 até 02/09/2026.
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: cardoso
          POSTGRES_PASSWORD: iteraima
          POSTGRES_DB: titularr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardoso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout web-titula-rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A api-titula-rr é um repositório IRMÃO, não um pacote publicado —
      # o e2e precisa dela rodando de verdade do outro lado da rede.
      # Checkout num subdiretório, mesma máquina do runner.
      #
      # SEM `ref:` de propósito (decidido em 02/09/2026): pega o HEAD do
      # branch padrão da API. Isso significa que uma mudança lá pode deixar
      # vermelho um PR daqui que não encostou em nada — e é exatamente o que
      # se quer, porque é o único lugar que prova o comportamento contra a
      # API real. Fixar a ref transformaria o e2e num teste contra uma foto
      # antiga. O job `contrato` cobre o lado dos tipos; este cobre o do
      # comportamento.
      - name: Checkout api-titula-rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4jc4/api-titula-rr
          path: api-titula-rr

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Sobe a api-titula-rr (AUTH_VALIDATOR=fake, NODE_ENV=test)
        working-directory: api-titula-rr
        env:
          DATABASE_URL: postgresql://cardoso:iteraima@localhost:5432/titularr_test
        run: |
          npm ci
          npx prisma migrate deploy

          # NODE_ENV=test desliga o throttle de /auth/login (ver
          # AppThrottlerGuard no backend) — sem isso a suíte esbarra no
          # rate limit de 5/min só de tanto logar em sequência ao longo dos
          # specs. Processo em background sobrevive aos próximos steps: são
          # todos a mesma VM do job.
          NODE_ENV=test AUTH_VALIDATOR=fake npm run start:dev \
            > /tmp/api-titula-rr.log 2>&1 &

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "::error::api-titula-rr não respondeu em /api/health a tempo"
          cat /tmp/api-titula-rr.log
          exit 1

      - name: Instala dependências e o Chromium do Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Builda e sobe o Next de verdade (ver playwright.config.ts) — não
      # dev server, mesmo espírito do docker-image job da API: pega
      # quebra que só aparece em build de produção.
      - name: Roda o e2e
        env:
          API_INTERNAL_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Logs da api-titula-rr (só em caso de falha)
        if: failure()
        run: cat /tmp/api-titula-rr.log || true

      - name: Relatório do Playwright (só em caso de falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Guarda de contrato. Sem ele, uma divergência entre o cliente gerado e o
  # OpenAPI da API só aparecia se algum dos nove testes e2e passasse por cima
  # dela — foi assim que o enum Papel ficou dois dias errado aqui, com dois
  # papéis que o Postgres já não aceitava e quatro que ele passou a aceitar.
  # Noventa segundos aqui valem mais que a varredura que descobriu aquilo.
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Só o arquivo openapi/openapi.json interessa — a API o versiona e o CI
      # dela falha se ele divergir do código, então é fonte confiável sem
      # precisar subir nada.
      - name: Checkout api-titula-rr (contrato)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4jc4/api-titula-rr
          path: api-titula-rr

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Regenera o cliente e exige que nada mude
        env:
          ORVAL_API_URL: api-titula-rr/openapi/openapi.json
        run: |
          npm run codegen
          git diff --exit-code -- lib/api/generated || {
            echo "::error::lib/api/generated está defasado em relação ao contrato da api-titula-rr. Rode: ORVAL_API_URL=../api-titula-rr/openapi/openapi.json npm run codegen"
            exit 1
          }

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Builda a imagem de produção
        run: docker build -t web-titula-rr:ci .

      # Sem API_INTERNAL_URL apontando pra nada real de propósito: o ponto
      # deste job é confirmar que o CONTAINER sobe e serve — se o CMD do
      # Dockerfile (server.js, do output standalone) ficar dessincronizado
      # da saída real do build, é AQUI que quebra, não em produção. Junto,
      # prova que /status não derruba (500) quando a API está inalcançável
      # — é exatamente o cenário que app/status/page.tsx trata.
      - name: Sobe o container e confere /healthz e /status
        run: |
          docker run -d --name web-titula-rr-ci \
            -p 3001:3000 \
            -e API_INTERNAL_URL=http://localhost:9999 \
            web-titula-rr:ci

          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3001/healthz > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "== logs do container =="
          docker logs web-titula-rr-ci

          [ -n "$ok" ] || { echo "::error::container não respondeu em /healthz"; exit 1; }

          echo "== /status com API inalcançável (não pode dar 500) =="
          status_code=$(curl -sS -o /tmp/status-body.html -w '%{http_code}' http://localhost:3001/status)
          echo "status HTTP: $status_code"
          [ "$status_code" = "200" ] || { echo "::error::‎/status devolveu $status_code em vez de 200 com API fora do ar"; cat /tmp/status-body.html; exit 1; }
          grep -q 'Fora do ar' /tmp/status-body.html || { echo "::error::/status não mostrou o estado 'down'"; cat /tmp/status-body.html; exit 1; }

      - name: Limpa o container
        if: always()
        run: docker rm -f web-titula-rr-ci || true
