name: PR Title

# Mesma convenção da api-titula-rr: Conventional Commits é exigido só no
# TÍTULO do PR (o pre-commit local não valida a mensagem de commit).
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Valida o título do PR (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
